# The warehouse path and DuckDB settings come from environment variables that
# scripts/03_dbt.py sets from config/project.yaml. The defaults below apply only
# when dbt is run by hand from inside dbt/.
taxi_shock:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('TAXI_SHOCK_WAREHOUSE', '../data/warehouse.duckdb') }}"
      threads: 1
      settings:
        memory_limit: "{{ env_var('TAXI_SHOCK_DUCKDB_MEMORY', '5GB') }}"
        threads: "{{ env_var('TAXI_SHOCK_DUCKDB_THREADS', '10') }}"
        TimeZone: "{{ env_var('TAXI_SHOCK_TZ', 'America/New_York') }}"
        preserve_insertion_order: false
        max_temp_directory_size: "{{ env_var('TAXI_SHOCK_DUCKDB_MAX_TMP', '15GB') }}"
    # E3: Snowflake. Every value comes from the environment (`source ~/.snowflake/taxi.env`,
    # outside the repository); key-pair authentication, nothing secret in this file.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: "{{ env_var('TAXI_SHOCK_SNOWFLAKE_THREADS', '4') | int }}"
      client_session_keep_alive: false
      query_tag: taxi_shock_e3
