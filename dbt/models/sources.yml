version: 2

sources:
  - name: raw
    description: Raw files under data/raw/, read in place by DuckDB (never copied).
    tables:
      - name: yellow_trips
        description: TLC yellow-taxi trip records, one Parquet file per month.
        config:
          meta:
            external_location: "read_parquet('{{ var(\"yellow_glob\") }}', filename = true, union_by_name = true)"
      - name: weather
        description: Open-Meteo archive hourly weather, one CSV per (partial) year.
        config:
          meta:
            external_location: "read_csv('{{ var(\"weather_glob\") }}', header = true, union_by_name = true)"
      - name: zone_lookup
        description: TLC taxi_zone_lookup.csv.
        config:
          meta:
            external_location: "read_csv('{{ var(\"zone_lookup_csv\") }}', header = true)"
