version: 2

sources:
  - name: raw
    description: Raw files under data/raw/ (and the committed CBD mapping), read in place by DuckDB.
    tables:
      - name: yellow_trips
        description: TLC yellow-taxi trip records, one Parquet file per month.
        config:
          meta:
            external_location: "read_parquet('{{ var(\"yellow_glob\") }}', filename = true, union_by_name = true)"
      - name: weather
        description: Open-Meteo archive hourly weather (GMT unix seconds), one CSV per padded chunk.
        config:
          meta:
            external_location: "read_csv('{{ var(\"weather_glob\") }}', header = true, union_by_name = true, filename = true)"
      - name: zone_lookup
        description: TLC taxi_zone_lookup.csv.
        config:
          meta:
            external_location: "read_csv('{{ var(\"zone_lookup_csv\") }}', header = true)"
      - name: zones_cbd
        description: config/zones_cbd.csv, written by scripts/03a_cbd_map.py (is_cbd per zone + source).
        config:
          meta:
            external_location: "read_csv('{{ var(\"zones_cbd_csv\") }}', header = true)"
      # E3 (Snowflake only): tables loaded by scripts/24_snowflake_load.py into schema RAW
      - name: yellow_trips_valid
        description: Cleaned yellow trips (int_trips_flagged rows with drop_reason NULL, DuckDB), source months 2023-01 to 2026-09.
        config:
          enabled: "{{ target.type == 'snowflake' }}"
        columns:
          - name: pickup_ts
            data_tests:
              - not_null:
                  config:
                    enabled: "{{ target.type == 'snowflake' }}"
          - name: source_month
            data_tests:
              - not_null:
                  config:
                    enabled: "{{ target.type == 'snowflake' }}"
      - name: hvfhv_zone_hour
        description: HVFHV aggregate (i), pickup zone x hour x platform x shared flags x trip type x distance bin.
        config:
          enabled: "{{ target.type == 'snowflake' }}"
        columns:
          - name: zone_id
            data_tests:
              - not_null:
                  config:
                    enabled: "{{ target.type == 'snowflake' }}"
          - name: trips
            data_tests:
              - not_null:
                  config:
                    enabled: "{{ target.type == 'snowflake' }}"
      - name: hvfhv_pair_week
        description: HVFHV aggregate (ii), pickup zone x dropoff zone x week x platform.
        config:
          enabled: "{{ target.type == 'snowflake' }}"
        columns:
          - name: week_start
            data_tests:
              - not_null:
                  config:
                    enabled: "{{ target.type == 'snowflake' }}"
          - name: trips
            data_tests:
              - not_null:
                  config:
                    enabled: "{{ target.type == 'snowflake' }}"
