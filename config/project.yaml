# Single source of truth for dates, thresholds and paths (CLAUDE.md: no hard-coded values in code).
# Values under the PLAN §4 keys are copied verbatim from PLAN.md; additional keys are documented in DECISIONS.md.
seed: 20260107
timezone: America/New_York

data:
  yellow_months: ["2019-01", "2026-09"]      # downloaded; EDA uses all
  model_start: "2022-01-01"                  # post-COVID recovery; see DECISIONS
  policy_date: "2025-01-05"
  pre_period:  ["2024-01-06", "2025-01-04"]  # 52 weeks
  post_period: ["2025-01-05", "2026-09-30"]
  event_study_window: ["2023-01-01", "2026-09-30"]

zones:
  valid_ids: [1, 263]                         # 264/265 = unknown -> drop
  min_mean_hourly_pickups_2024: 1.0           # forecast-modeled zones threshold; see Phase 2

forecast:
  horizon_hours: 24
  origin: "00:00"                             # forecast issued at midnight for the next 24h
  min_lag_hours: 24
  quantiles: [0.1, 0.5, 0.9]
  backtest:
    pre_shock_test: ["2024-01-01", "2024-12-31"]
    refit: monthly
    windows: ["expanding", "sliding_24m"]

causal:
  outcome: "log1p_pickups"
  unit: "zone_week"                           # primary; zone_day for heterogeneity
  control: "manhattan_non_cbd"                # primary; outer_boroughs robustness
  cluster_se: "zone"

# ---- Additional keys (not in PLAN §4); each one has a DECISIONS.md line ----
forecast_eval:
  horizon_buckets: [[1, 6], [7, 12], [13, 18], [19, 24]]
  interval: [0.1, 0.9]                        # the 80% interval = outer quantiles
  mape_min_y: 10                              # MAPE (never primary) only on hours with y >= 10
chronos:                                      # PLAN Phase 2 model 4 (Colab only; DECISIONS.md)
  model_id: amazon/chronos-2
  package: "chronos-forecasting==2.3.2"       # = pyproject [chronos]; torch comes with Colab
  context_hours: 2048                         # PLAN: context 2048 h (grid hours before the origin)
  origins: ["2024-01-01", "2026-09-30"]       # one Colab run serves Phase 2 (2024), 3 and 5
  test_output: results/chronos_forecasts.parquet          # origins in forecast.backtest.pre_shock_test
  post_output: results/chronos_forecasts_post.parquet     # origins after it (Phases 3 and 5)
  run_record: results/chronos_run.json
  calendar_covariates: [hour_sin, hour_cos, dow_sin, dow_cos, is_weekend, is_holiday]
  weather_covariates: [temp_f, precip_in, snowfall_in, wind_mph, rel_humidity_pct]
  variants:                                   # how the weather covariates enter
    weather_past: past                        # PLAN: weather = past covariates only
    weather_future: future                    # observed weather also over the target day (= LGBM's information)
  batch_size: 256                             # series per GPU batch (target + covariates count)
  bundle: data/processed/chronos_bundle.zip   # what Stanley uploads to Google Drive
quality:                                      # PLAN Phase 1 filter rules, parameterised
  straggler_days: 1                           # keep pickups in [month_start - 1d, month_end + 1d]
  min_duration_minutes: 1
  max_duration_hours: 3
  max_trip_distance_miles: 100
  flex_fare_payment_type: 0                   # TLC dictionary 2025-03-18: 0 = Flex Fare trip; DECISIONS
  max_monthly_removal_ratio: 2.0              # dbt test: a month removing > 2x the median share fails

cbd:                                          # PLAN Phase 1 is_cbd derivation (two-step)
  street_names: ["West 60th Street", "East 60th Street"]   # OSM names of 60th St in Manhattan
  fee_window: ["2025-02-01", "2025-06-30"]    # pickups used for the fee-based validation
  fee_share_cbd_min: 0.8                      # share of trips with cbd_congestion_fee > 0
  fee_share_not_cbd_max: 0.2
  fee_min_trips: 100                          # fewer valid pickups in the window -> "insufficient"
  agreement_min: 0.95                         # tests/test_cbd_map.py
  manual_overrides:                           # PLAN: "resolve manually"; each one in DECISIONS.md
    103: {is_cbd: false, reason: "harbour island (Governor's/Ellis/Liberty), no road access, not in the Congestion Relief Zone"}
    104: {is_cbd: false, reason: "harbour island (Governor's/Ellis/Liberty), no road access, not in the Congestion Relief Zone"}
    105: {is_cbd: false, reason: "harbour island (Governor's/Ellis/Liberty), no road access, not in the Congestion Relief Zone"}
  trip_check_window: ["2025-02-01", "2026-09-30"]   # Checkpoint 1: trip-level fee check, monthly

vendors:                                      # Checkpoint 1 vendor checks (DECISIONS.md)
  names:                                      # VendorID, TLC yellow data dictionary 2025-03-18
    1: "Creative Mobile Technologies"
    2: "Curb Mobility"
    6: "Myle Technologies"
    7: "Helix"
  new_vendor_id: 7                            # Helix: records with missing dropoff time
  entry_share_min: 0.01                       # entry week = first complete week with >= 1% of pickups
  present_min_week_share: 1.0                 # "present throughout" = pickups in every complete week

panel:
  week_start: sunday                          # sunday (policy-aligned) | monday (ISO); DECISIONS
  hour_bands: [[0, 6], [6, 10], [10, 16], [16, 20], [20, 24]]   # PLAN Phase 1, [lo, hi)
  distance_tercile_period: ["2024-01-06", "2025-01-04"]       # = data.pre_period; DECISIONS

annotations:
  covid_ny_pause: "2020-03-22"                # NY State on PAUSE (Executive Order 202.8) effective

sources:
  tlc_base_url: "https://d37ci6vzurychx.cloudfront.net"
  osm_overpass_url: "https://overpass-api.de/api/interpreter"   # 60th St geometry (ODbL)
  yellow_path: "trip-data/yellow_tripdata_{month}.parquet"
  hvfhv_path: "trip-data/fhvhv_tripdata_{month}.parquet"   # Phase 6 only (optional)
  hvfhv_months: ["2024-01", "2026-09"]                     # PLAN Phase 6 restriction
  zone_lookup_path: "misc/taxi_zone_lookup.csv"
  zone_shapefile_path: "misc/taxi_zones.zip"
  weather_url: "https://archive-api.open-meteo.com/v1/archive"
  weather_point: [40.7128, -74.006]           # one city-wide point (same as the old project)
  weather_units: {temperature_unit: fahrenheit, wind_speed_unit: mph, precipitation_unit: inch}
  weather_hourly: [temperature_2m, apparent_temperature, precipitation, rain, snowfall,
                   weathercode, cloudcover, windspeed_10m, relativehumidity_2m]
  weather_pad_days: 1                         # GMT request padded so local hours are covered
  http_retries: 5
  http_timeout_seconds: 120

paths:                                        # relative to the repo root
  raw_yellow: data/raw/tlc/yellow
  raw_hvfhv: data/raw/tlc/hvfhv
  raw_weather: data/raw/weather
  raw_lookup: data/raw/lookup
  zones_cbd: config/zones_cbd.csv
  holidays_seed: dbt/seeds/holidays_ny.csv
  processed: data/processed
  duckdb_tmp: data/duckdb_tmp
  manifest: data/raw/manifest.csv
  warehouse: data/warehouse.duckdb
  smoke_warehouse: data/smoke.duckdb
  results: results
  figures: reports/figures

duckdb:
  memory_limit: "5GB"
  threads: 10
  max_temp_directory_size: "15GB"             # spill cap: a runaway query fails, not the disk

smoke:
  month: "2024-10"
  backtest_origins: ["2024-10-15", "2024-10-31"]  # needs >= 7 days of history for lag_168
  results_dir: results/smoke
  figures_dir: reports/figures/smoke
  max_runtime_minutes: 10
