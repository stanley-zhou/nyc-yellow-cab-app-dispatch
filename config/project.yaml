# Single source of truth for dates, thresholds and paths (CLAUDE.md: no hard-coded values in code).
# Values under the PLAN §4 keys are copied verbatim from PLAN.md; additional keys are documented in DECISIONS.md.
seed: 20260107
timezone: America/New_York

data:
  yellow_months: ["2019-01", "2026-09"]      # downloaded; EDA uses all
  model_start: "2022-01-01"                  # post-COVID recovery; see DECISIONS
  policy_date: "2025-01-05"
  pre_period:  ["2024-01-06", "2025-01-04"]  # 52 weeks
  post_period: ["2025-01-05", "2026-09-30"]
  event_study_window: ["2023-01-01", "2026-09-30"]

zones:
  valid_ids: [1, 263]                         # 264/265 = unknown -> drop
  min_mean_hourly_pickups_2024: 1.0           # forecast-modeled zones threshold; see Phase 2

forecast:
  horizon_hours: 24
  origin: "00:00"                             # forecast issued at midnight for the next 24h
  min_lag_hours: 24
  quantiles: [0.1, 0.5, 0.9]
  backtest:
    pre_shock_test: ["2024-01-01", "2024-12-31"]
    refit: monthly
    windows: ["expanding", "sliding_24m"]

shock:                                        # PLAN Phase 3: where the forecaster breaks
  frozen_train_end: "2024-12-31"              # primary LGBM trained once through this day
  forecast_window: ["2024-07-01", "2026-09-30"]   # day-ahead origins, no retraining
  monitor_start: "2025-01-01"                 # frozen model deployed; monitors start here
  calibration_period: ["2024-01-01", "2024-12-31"]  # out-of-sample Phase-2 backtest residuals
  rolling_days: 28                            # rolling 4-week WAPE and bias
  groups: [cbd, non_cbd, manhattan_non_cbd, airports, other, all]   # non_cbd = every modeled
                                                                    # zone outside the CBD
  monitored_groups: [cbd, non_cbd]            # drift monitors: CBD (PLAN) and its contrast
  cusum:
    k: 0.5                                    # reference value (sigma units): detects ~1 sigma
    max_false_alarms: 1                       # PLAN: <= 1 false alarm per year on 2024
    h_grid: [0.5, 30.0, 0.05]                 # smallest h on this grid meeting the rule
  rolling_bias:
    n_sigma: 2.0                              # PLAN: bias beyond 2 sigma ...
    consecutive_days: 7                       # ... for 7 consecutive days, same sign
speed:                                        # Amendment 2 (B1-B3): trip duration and speed
  window: ["2023-01-01", "2026-09-30"]        # = data.event_study_window
  max_speed_mph: 65                           # fixed before any speed data were examined:
                                              # NY's highest posted limit; faster = record error
  tercile_period: ["2024-01-06", "2025-01-04"]  # distance terciles of the speed sample
                                              # (B3: "fixed on 2024 quantiles"; = pre_period)
  outcomes: [log_mean_speed_mph, log_mean_duration_min]   # pair-week means of trip values
  cluster: [pu_zone_id, do_zone_id]           # two-way by pickup and dropoff zone (primary)
  outer_boroughs: [Brooklyn, Queens]          # C4 control region (airports excluded): trips
                                              # with both ends in these boroughs
source_outages:                               # TLC source files missing most trips (DECISIONS)
  windows: [["2022-09-17 15:00", "2022-09-18 23:59"], ["2023-09-21 14:00", "2023-09-24 23:59"]]
  rule: {hour_share: 0.10, weeks_each_side: 4, min_reference: 200, snow_day_in: 1.0}
  real_events: [["2020-03-01", "2020-04-30"]]   # COVID onset: real collapse, not an outage
app_dispatch:                                 # Amendment 3, C1 (mechanism check)
  months: ["2026-06", "2026-09"]              # yellow files that carry request_source
  app_codes: {HV0003: uber, HV0005: lyft}     # TLC HVFHS licence numbers (HVFHS dictionary)
  min_trips: 500                              # zones with fewer records in the window: no share
  growth_years: [2023, 2025]                  # growth = log(mean weekly pickups 2025 / 2023)
  min_weekly_base: 10                         # zones below this in the base year: no growth
channel:                                      # Amendment 4 (D0-D5): app dispatch vs street hail
  label_months: ["2026-06", "2026-09"]        # files with request_source (D0 validation window)
  hv_codes: [HV0003, HV0005]                  # ride-hail apps (Uber, Lyft): the D0 "app" definition
  hv_platform_names: {HV0003: uber, HV0005: lyft}   # HVFHV hvfhs_license_num (D4, D5b, C6)
  # request_source codes = "Origin of e-hail request" (NYC Open Data, 2025 Yellow Taxi Trip Data,
  # column description). EH codes from TLC's current e-hail licensee list
  # (nyc.gov/assets/tlc/downloads/datasets/current_e-hail_licensee.xls, retrieved 2026-11-12,
  # sha256 55e6c449...94e2): EH0004 Curb Mobility LLC, EH0010 Arro Inc, EH0013 Myle Technologies.
  # 'A' and 'CC' are on no published TLC list: undetermined.
  code_meanings:
    HV0003: "Uber (HVFHS licence, HVFHS data dictionary)"
    HV0005: "Lyft (HVFHS licence, HVFHS data dictionary)"
    EH0004: "Curb Mobility LLC (TLC e-hail licence; Curb's own app)"
    EH0010: "Arro, Inc. (TLC e-hail licence)"
    A: "undetermined (not on any published TLC licence list)"
    CC: "undetermined (not on any published TLC licence list)"
  gate: {min_rate: 0.85, min_group_share: 0.01}   # Amendment 4, D0
  label_start: "2023-01"                      # Flex label used from here if the gate passes
  # Amendment 4a (D0 ruling, option c): app channel = any e-hail app; Flex Fare before the
  # request_source files, request_source not NULL from them (cut-over by source file month)
  request_source_from: "2026-06-01"
  window: ["2023-01-01", "2026-09-30"]        # channel marts (= data.event_study_window)
  platforms: {HV0003: uber, HV0005: lyft, EH0004: curb_app, EH0010: arro, A: code_a, CC: code_cc}
  cmt_block: {vendor_id: 1, zone_group: other, channel: street}   # Amendment 4a: own series
  cmt_block_diagnosis:                        # 10b: the break week (D0) and the windows around it
    break_week: "2026-05-31"
    weeks_each_side: 4
    weekly_window: ["2026-04-26", "2026-06-28"]
    months_before: ["2026-03", "2026-05"]
    months_after: ["2026-06", "2026-08"]
  motivation_months: ["2023-01", "2024-04", "2025-01", "2026-01"]   # Amendment 4's figures
  net_ratio_min_app_change: 1000              # accounting net ratio withheld below this app change
                                              # (trips/week): airports' ~20-70 makes it meaningless
  map_min_weekly: 20                          # F6b: zones below this mean weekly pickups hatched
  break_ratio: 0.5                            # test: a vendor x zone-group series may not fall
  break_min_weekly: 1000                      #   below half its previous week (base >= this)
  known_breaks:                               # every flagged break must be listed with a reason
    - {zone_group: other, vendor_id: 1, week_start: "2026-05-31",
       reason: "CMT outer-borough contracted-trip block ends (DECISIONS, D1)"}
    - {zone_group: other, vendor_id: 6, week_start: "2026-05-24",
       reason: "one-week dip of Myle (1,156 -> 127), back to 894 the next week; not a level change"}
  step_window_weeks: 4                        # D0 step dating: mean of 4 weeks after vs 4 before
  step_top_n: 5                               # steps listed per zone group
incr:                                         # Amendment 4 D2: incrementality (DML)
  min_weekly: 20                              # zones kept: 2023 mean weekly pickups >= this
  n_folds: 5                                  # cross-fitting on contiguous time blocks of weeks
  n_rep: 25                                   # DoubleML panel estimator: repeated fold draws (median)
  min_zones_inference: 10                     # fewer clusters: estimates reported without inference
  lgbm: {n_estimators: 300, learning_rate: 0.05, num_leaves: 31, min_child_samples: 50,
         subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8}
  block_sensitivity_end: "2026-05-24"         # Amendment 4a: sensitivity with the CMT block
  supply_from: "2022-01"                      # TLC monthly report: supply view 2022 ->
lyft:                                         # Amendment 4 D3, Amendment 4a timing
  pre_end: "2026-07-08"                       # primary clean windows: pre <= this
  post_start: "2026-08-10"                    #   post >= this (first HV0005 day); between excluded
  long_pre_start: "2025-06-01"                # total / app / street: long pre-period
  uber_pre_start: "2026-06-01"                # Uber-dispatched: request_source exists from here
  secondary_start: "2026-07-09"               # hypothesis: code-A surge = Lyft before HV0005
  code_a_baseline: ["2026-07-01", "2026-07-08"]
  post_hoc_pre_end: "2026-05-30"              # post hoc: last day before the request_source files
channel_did:                                  # Amendment 4 D5 / D5b
  alpha: 0.05                                 # D5 gate: Hotelling F* pre-trend p must be >= this
  step_window: ["2024-07-01", "2025-06-30"]   # D5b: event-study window around 2025-01-05
  d0_step_week: "2025-01-19"                  # D0: +10.9 pp app-share step (all zones)
  step_weeks_each_side: 4                     # D5b descriptive step: weeks after vs before
  lyft_splits: {jan_2025: ["2025-01-05", "2025-01-31"], after_jan_2025: ["2025-02-01", null]}
                                              # C6: Lyft's January 2025 (rider credit) separate;
                                              # null = the last panel week
hvfhv:                                        # Amendment 4: streaming aggregates (raw files not kept)
  months: ["2023-01", "2026-09"]              # Amendment 4 (extended for D4)
  out_dir: data/processed/hvfhv               # monthly aggregate Parquet files
  manifest: data/raw/hvfhv_manifest.csv       # URL, bytes, sha256, rows, download date
  disk_guard_env: TAXI_SHOCK_DISK_GUARD       # path of the Windows drive holding the WSL disk image
  min_free_gb: 15                             # stop before a download below this (Amendment 4)
  # distance bins (miles, upper edges): the yellow distance-tercile cuts 1.29 / 2.62
  # (results/data_quality.json) plus a 1-mile ladder, so yellow-tercile splits are exact and
  # FHV terciles can be approximated (DECISIONS, Amendment 4 HVFHV)
  distance_edges: [1, 1.29, 2, 2.62, 3, 4, 5, 6, 8, 10, 15, 20]
shocks:                                       # Amendment 3, C5: three shocks, one monitor
  events:
    covid: "2020-03-01"
    fare_increase: "2022-12-19"               # TLC industry notice 22-02 (DECISIONS)
    congestion_pricing: "2025-01-05"
  train_months: 12                            # frozen model: the 12 months before the event
  monitor_months: 12                          # day-ahead forecasts for 12 months from it
  calibration_folds: 2                        # cross-fit halves of the training year (DECISIONS)
  groups: [cbd, non_cbd, all]
  level_windows_days: [28, 365]               # post-event mean log(actual / forecast)
synth:                                        # Amendment 3, C3 (DECISIONS: specification)
  min_donor_weekly: 1000                      # 2024 mean pickups per week
  pre_period: ["2023-01-01", "2024-12-28"]    # weeks starting in this range
  post_end: "2026-09-30"
  in_time_placebo_week: "2024-01-07"
causal:
  outcome: "log1p_pickups"
  unit: "zone_week"                           # primary; zone_day for heterogeneity
  # AMENDED 2026-11-07 (Stanley, human-approved; PLAN Amendments): PLAN value "manhattan_non_cbd"
  # is now a robustness run; the primary control drops the six zones straddling 60th St.
  control: "manhattan_non_cbd_donut"          # primary
  control_robustness: ["manhattan_non_cbd", "outer_boroughs"]
  control_groups:                             # resolved by taxi_shock.causal.panel.control_zone_ids
    manhattan_non_cbd_donut: {zone_groups: [manhattan_non_cbd], exclude_zones: [43, 140, 141, 142, 143, 237]}
    manhattan_non_cbd: {zone_groups: [manhattan_non_cbd], exclude_zones: []}
    outer_boroughs: {boroughs: [Brooklyn, Queens], exclude_airports: true, exclude_zones: []}
    outer_boroughs_with_airports: {boroughs: [Brooklyn, Queens], exclude_airports: false, exclude_zones: []}   # PLAN heterogeneity: airports included
  cluster_se: "zone"
  pre_weeks: 52                               # PLAN: static DiD pre = 52 weeks before
  post_splits:                                # PLAN: persistence (week starts, inclusive)
    post_2025_h1: ["2025-01-05", "2025-06-28"]
    post_2025_h2: ["2025-06-29", "2025-12-27"]
    post_2026: ["2025-12-28", "2026-09-30"]
  placebo_week: "2024-01-07"                  # PLAN placebo in time, on 2023-2024 data only
  placebo_window: ["2023-01-01", "2024-12-31"]
  weather_controls: [mean_temp_f, total_precip_in]   # enter as x treated (week FE absorb levels)
  trade_off:                                  # A3 / B5 (DECISIONS)
    fee_per_trip: 0.75                        # taxi congestion fee (PLAN §1)
    values_of_time: [20, 30, 40]              # $/h (Amendment 2, B5)
  effect_map_min_pre_weekly: 50               # F4b: zones below this are hatched (DECISIONS)
  effect_map_colour_quantile: 0.95            # F4b: symmetric colour limit = this quantile of |v|
  pretrend_size:                              # scripts/07d_pretrend_size.py (DECISIONS)
    reps: 200
    ar_rho: 0.5                               # AR(1) zone-week noise
    noise_sd: 0.05
    designs: [[38, 25], [20, 20]]             # treated / control zones (38/25: demand design)
  permutation:                                # Amendment 1 (A2), pre-policy data only
    draws: 500
    window: ["2023-01-01", "2025-01-04"]
    min_side_weeks: 26                        # fake week leaves >= 26 weeks on each side
    pre_weeks: 52                             # placebo static window: <= 52 weeks before
    size: 0.05
    power: 0.8

# ---- Additional keys (not in PLAN §4); each one has a DECISIONS.md line ----
models:                                       # PLAN Phase 2
  validation_year: ["2023-01-01", "2023-12-31"]   # LGBM grid + split-conformal calibration
  feature_history_days: 35                    # panel loaded this far before model_start (lags)
  threads: 10
  stat:                                       # StatBaseline: AutoETS on daily totals x profile
    daily_season_length: 7                    # weekly seasonality (ETS supports m <= 24 only)
    profile_weeks: 8                          # hour-of-day share profile per weekday
    residual_weeks: 52                        # interval residual quantiles (zone x hour)
  lgbm:
    grid: {learning_rate: [0.05, 0.1], num_leaves: [31, 127], min_data_in_leaf: [20, 200]}
    fixed: {feature_fraction: 0.9, bagging_fraction: 0.8, bagging_freq: 1, max_bin: 255}
    refit_early_stopping:                     # every backtest refit (Stanley, 2026-11-08)
      holdout_weeks: 4                        # last 4 weeks of the training window
      rounds: 100
      min_delta: 0.001
      max_rounds: 10000
    max_rounds: 10000                         # run 1 (cap 3000, no tolerance) hit the cap: DECISIONS
    early_stopping_rounds: 100
    early_stopping_min_delta: 0.001           # pinball improvement (pickups) that counts as progress
    predict_history_days: 30                  # history passed to the feature builder at predict
                                              # time: 28-day rolling mean + 1 day + margin (DECISIONS)
  conformal:
    alpha: 0.2                                # 80% interval
    group_by: zone_group                      # PLAN: per zone group
    rolling_weeks: 12                         # Stanley 2026-11-08: trailing-window calibration
    primary: conformal_rolling_12w            # reported first; conformal_2023 kept beside it
  primary_window_rule:                        # pre-registered before any 2024 result (DECISIONS)
    metric: mean_pinball                      # LGBM, all modeled zones, test year
    tie_relative: 0.01                        # |difference| < 1% -> expanding
  f2:                                         # WAPE-gap uncertainty behind any ranking in F2
    bootstrap_reps: 2000                      # paired block bootstrap over origin days
    block_days: 7                             # consecutive-day blocks keep weekly dependence
  f2b:                                        # fan chart: busiest CBD zone of 2024, this week
    week_start: "2024-10-13"                  # Sunday; no holiday, no DST change
forecast_eval:
  horizon_buckets: [[1, 6], [7, 12], [13, 18], [19, 24]]
  interval: [0.1, 0.9]                        # the 80% interval = outer quantiles
  mape_min_y: 10                              # MAPE (never primary) only on hours with y >= 10
chronos:                                      # PLAN Phase 2 model 4 (Colab only; DECISIONS.md)
  model_id: amazon/chronos-2
  package: "chronos-forecasting==2.3.2"       # = pyproject [chronos]; torch comes with Colab
  context_hours: 2048                         # PLAN: context 2048 h (grid hours before the origin)
  origins: ["2024-01-01", "2026-09-30"]       # one Colab run serves Phase 2 (2024), 3 and 5
  test_output: results/chronos_forecasts.parquet          # origins in forecast.backtest.pre_shock_test
  post_output: results/chronos_forecasts_post.parquet     # origins after it (Phases 3 and 5)
  run_record: results/chronos_run.json
  calendar_covariates: [hour_sin, hour_cos, dow_sin, dow_cos, is_weekend, is_holiday]
  weather_covariates: [temp_f, precip_in, snowfall_in, wind_mph, rel_humidity_pct]
  variants:                                   # how the weather covariates enter
    weather_past: past                        # PLAN: weather = past covariates only
    weather_future: future                    # observed weather also over the target day (= LGBM's information)
  primary_variant: weather_past               # PLAN's specification (weather = past covariate);
                                              # weather_future reported beside it (DECISIONS)
  batch_size: 256                             # series per GPU batch (target + covariates count)
  bundle: data/processed/chronos_bundle.zip   # what Stanley uploads to Google Drive
  bundle_dir: data/processed/chronos          # committed bundle files + manifest of this run
  calibration_run:                            # Stanley 2026-11-09: calibration parity only
    name: calib_2023                          # second Colab run, same script, merged into
    origins: ["2023-10-01", "2023-12-31"]     # test_output (column `run`) by chronos-import
    bundle_dir: data/processed/chronos_calib_2023
    bundle: data/processed/chronos_bundle_calib_2023.zip
    inbox: data/chronos_inbox/calib_2023      # where the three returned files go (git-ignored)
    run_record: results/chronos_run_calib_2023.json
quality:                                      # PLAN Phase 1 filter rules, parameterised
  straggler_days: 1                           # keep pickups in [month_start - 1d, month_end + 1d]
  min_duration_minutes: 1
  max_duration_hours: 3
  max_trip_distance_miles: 100
  flex_fare_payment_type: 0                   # TLC dictionary 2025-03-18: 0 = Flex Fare trip; DECISIONS
  max_monthly_removal_ratio: 2.0              # dbt test: a month removing > 2x the median share fails

cbd:                                          # PLAN Phase 1 is_cbd derivation (two-step)
  street_names: ["West 60th Street", "East 60th Street"]   # OSM names of 60th St in Manhattan
  fee_window: ["2025-02-01", "2025-06-30"]    # pickups used for the fee-based validation
  fee_share_cbd_min: 0.8                      # share of trips with cbd_congestion_fee > 0
  fee_share_not_cbd_max: 0.2
  fee_min_trips: 100                          # fewer valid pickups in the window -> "insufficient"
  agreement_min: 0.95                         # tests/test_cbd_map.py
  manual_overrides:                           # PLAN: "resolve manually"; each one in DECISIONS.md
    103: {is_cbd: false, reason: "harbour island (Governor's/Ellis/Liberty), no road access, not in the Congestion Relief Zone"}
    104: {is_cbd: false, reason: "harbour island (Governor's/Ellis/Liberty), no road access, not in the Congestion Relief Zone"}
    105: {is_cbd: false, reason: "harbour island (Governor's/Ellis/Liberty), no road access, not in the Congestion Relief Zone"}
  trip_check_window: ["2025-02-01", "2026-09-30"]   # Checkpoint 1: trip-level fee check, monthly

vendors:                                      # Checkpoint 1 vendor checks (DECISIONS.md)
  names:                                      # VendorID, TLC yellow data dictionary 2025-03-18
    1: "Creative Mobile Technologies"
    2: "Curb Mobility"
    6: "Myle Technologies"
    7: "Helix"
  new_vendor_id: 7                            # Helix: records with missing dropoff time
  entry_share_min: 0.01                       # entry week = first complete week with >= 1% of pickups
  present_min_week_share: 1.0                 # "present throughout" = pickups in every complete week

panel:
  week_start: sunday                          # sunday (policy-aligned) | monday (ISO); DECISIONS
  hour_bands: [[0, 6], [6, 10], [10, 16], [16, 20], [20, 24]]   # PLAN Phase 1, [lo, hi)
  distance_tercile_period: ["2024-01-06", "2025-01-04"]       # = data.pre_period; DECISIONS

annotations:
  covid_ny_pause: "2020-03-22"                # NY State on PAUSE (Executive Order 202.8) effective

sources:
  tlc_base_url: "https://d37ci6vzurychx.cloudfront.net"
  osm_overpass_url: "https://overpass-api.de/api/interpreter"   # 60th St geometry (ODbL)
  yellow_path: "trip-data/yellow_tripdata_{month}.parquet"
  hvfhv_path: "trip-data/fhvhv_tripdata_{month}.parquet"   # Phase 6 only (optional)
  hvfhv_months: ["2024-01", "2026-09"]                     # PLAN Phase 6 restriction
  zone_lookup_path: "misc/taxi_zone_lookup.csv"
  tlc_monthly_report_url: "https://www.nyc.gov/assets/tlc/downloads/csv/data_reports_monthly.csv"   # D2 supply view
  zone_shapefile_path: "misc/taxi_zones.zip"
  weather_url: "https://archive-api.open-meteo.com/v1/archive"
  weather_point: [40.7128, -74.006]           # one city-wide point (same as the old project)
  weather_units: {temperature_unit: fahrenheit, wind_speed_unit: mph, precipitation_unit: inch}
  weather_hourly: [temperature_2m, apparent_temperature, precipitation, rain, snowfall,
                   weathercode, cloudcover, windspeed_10m, relativehumidity_2m]
  weather_pad_days: 1                         # GMT request padded so local hours are covered
  http_retries: 5
  http_timeout_seconds: 120

paths:                                        # relative to the repo root
  raw_yellow: data/raw/tlc/yellow
  raw_hvfhv: data/raw/tlc/hvfhv
  raw_weather: data/raw/weather
  raw_lookup: data/raw/lookup
  zones_cbd: config/zones_cbd.csv
  holidays_seed: dbt/seeds/holidays_ny.csv
  processed: data/processed
  forecasts: data/forecasts                   # backtest forecasts (git-ignored, large)
  duckdb_tmp: data/duckdb_tmp
  manifest: data/raw/manifest.csv
  warehouse: data/warehouse.duckdb
  smoke_warehouse: data/smoke.duckdb
  results: results
  figures: reports/figures

duckdb:
  memory_limit: "5GB"
  threads: 10
  max_temp_directory_size: "15GB"             # spill cap: a runaway query fails, not the disk

smoke:
  month: "2024-10"
  backtest_origins: ["2024-10-15", "2024-10-31"]  # needs >= 7 days of history for lag_168
  results_dir: results/smoke
  figures_dir: reports/figures/smoke
  max_runtime_minutes: 10
